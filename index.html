<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritma Care Link - Layanan Kesehatan Mahasantri</title>

    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: { 'xs': '380px' },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.08)',
                        'glow': '0 0 20px -5px rgba(16, 185, 129, 0.3)'
                    }
                }
            }
        };
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            overflow-x: hidden;
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar { -webkit-overflow-scrolling: touch; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
        }

        input, select, textarea {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input, select, textarea {
                font-size: 0.875rem !important;
            }
        }

        .font-official {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ADMIN_WA_NUMBER = "+6285776091473";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwU9iRkVPD7-b54G60LN_UGr4oSa-6C2vTxx8Pd6hWDyKVrsDGOcIIRcNB3iw-Kl770/exec";

        const getSectorByBuilding = (b) => (b === "Gedung C" || b === "Gedung C (Putri)" ? "Putri" : "Putra");

        // NO DUMMY DATA AT ALL - PURE REALTIME SPREADSHEET DATABASE
        const INITIAL_ROOMS = [];
        const INITIAL_OBAT = [];
        const INITIAL_PETUGAS = [];
        const INITIAL_PERMINTAAN = [];

        function App() {
            const [currentView, setCurrentView] = useState("dashboard");
            const [userRole, setUserRole] = useState(null);
            const [currentMahasantri, setCurrentMahasantri] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('ritma_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [rooms, setRooms] = useState(INITIAL_ROOMS);
            const [medicines, setMedicines] = useState(INITIAL_OBAT);
            const [staff, setStaff] = useState(INITIAL_PETUGAS);
            const [requests, setRequests] = useState(INITIAL_PERMINTAAN);

            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            useEffect(() => {
                syncWithGoogleSheets();
            }, []);

            const callSheetsApi = async (action, payload) => {
                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action, payload })
                    });
                    return true;
                } catch (err) {
                    console.error("Sheets API POST error:", err);
                    return false;
                }
            };

            const syncWithGoogleSheets = async () => {
                setIsSyncing(true);
                try {
                    const fetchUrl = `${SCRIPT_URL}?action=getAllData`;
                    const response = await fetch(fetchUrl, { method: "GET" });
                    const result = await response.json();
                    
                    if (result && result.status === "success") {
                        setRooms(result.mahasantri || []);
                        setMedicines(result.obat || []);
                        setRequests(result.permintaan || []);
                        setStaff(result.petugas || []);
                        showToast("Database Spreadsheet Berhasil Disinkronkan!", "success");
                    }
                } catch (err) {
                    console.error("Gagal terhubung ke Google Sheets.", err);
                    showToast("Gagal terhubung ke Google Sheets. Cek SCRIPT_URL.", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const toggleDarkMode = () => {
                setIsDarkMode(prev => {
                    const nextMode = !prev;
                    localStorage.setItem('ritma_dark_mode', JSON.stringify(nextMode));
                    return nextMode;
                });
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const handleNimLogin = (nimInput) => {
                const cleanNim = String(nimInput).trim().toLowerCase();
                const found = rooms.find(m => String(m.NIM).trim().toLowerCase() === cleanNim);

                if (!found) {
                    showToast("NIM belum terdaftar di database! Silakan daftar terlebih dahulu.", "error");
                    return false;
                }

                setCurrentMahasantri(found);
                setUserRole("mahasantri");
                showToast(`Selamat datang, ${found.Nama}!`, "success");
                return true;
            };

            const handleRegisterMahasantri = (data) => {
                const existing = rooms.find(m => String(m.NIM).trim().toLowerCase() === String(data.nim).trim().toLowerCase());
                if (existing) {
                    showToast("NIM ini sudah terdaftar! Silakan langsung masuk dengan NIM.", "error");
                    return false;
                }

                const newMhs = {
                    ID: `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                    NIM: String(data.nim).trim(),
                    Nama: data.fullName,
                    Gedung: data.building,
                    No_Kamar: data.roomNo,
                    Status: data.status || "Sehat",
                    Sektor: data.sector,
                    Semester: data.semester || "Semester 1",
                    Jurusan: data.jurusan || "-",
                    Keluhan: data.keluhan || "",
                    Terakhir_Update: new Date().toISOString().split('T')[0]
                };

                setRooms(prev => [newMhs, ...prev]);
                setCurrentMahasantri(newMhs);
                setUserRole("mahasantri");
                callSheetsApi("saveMahasantri", newMhs);
                showToast("Pendaftaran berhasil dan tersimpan ke Spreadsheet!", "success");
                return true;
            };

            const handleAdminLogin = (password) => {
                if (password === "orkes2026" || password === "admin") {
                    setUserRole("admin");
                    showToast("Login Admin Berhasil!", "success");
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                setUserRole(null);
                setCurrentMahasantri(null);
                setCurrentView("dashboard");
                showToast("Anda telah keluar dari sistem.", "info");
            };

            const handleRequestMedicine = (medName, qty, symptom) => {
                if (!currentMahasantri) return;
                const orderId = `REQ-${Math.floor(100 + Math.random() * 900)}`;
                const newReq = {
                    ID_Order: orderId,
                    Tanggal: new Date().toISOString().split('T')[0],
                    NIM: currentMahasantri.NIM,
                    Nama: currentMahasantri.Nama,
                    Gedung: currentMahasantri.Gedung,
                    No_Kamar: currentMahasantri.No_Kamar,
                    Obat: medName,
                    Jumlah: parseInt(qty, 10) || 1,
                    Keluhan: symptom || "-",
                    Status: "Menunggu",
                    Sektor: currentMahasantri.Sektor || "Putra"
                };

                setRequests(prev => [newReq, ...prev]);
                callSheetsApi("savePermintaan", newReq);
                showToast(`Permintaan obat ${medName} berhasil dikirim!`, "success");

                // DIRECT TO WHATSAPP (+6285776091473)
                const waMsg = encodeURIComponent(
                    `*PERMINTAAN OBAT POSKES RITMA CARE*\n` +
                    `----------------------------------------\n` +
                    `*ID Order:* ${orderId}\n` +
                    `*Nama:* ${currentMahasantri.Nama}\n` +
                    `*NIM:* ${currentMahasantri.NIM}\n` +
                    `*Lokasi:* ${currentMahasantri.Gedung} - Kamar ${currentMahasantri.No_Kamar}\n` +
                    `*Obat:* ${medName} (${qty}x)\n` +
                    `*Keluhan:* ${symptom || '-'}\n` +
                    `----------------------------------------\n` +
                    `Mohon diproses, terima kasih!`
                );
                window.open(`https://wa.me/6285776091473?text=${waMsg}`, '_blank');
            };

            const handleUpdateRequestStatus = (orderId, newStatus) => {
                const reqItem = requests.find(r => r.ID_Order === orderId);
                if (newStatus === "Disetujui" && reqItem) {
                    setMedicines(prevMeds => prevMeds.map(m => {
                        if (m.Nama_Obat.toLowerCase() === reqItem.Obat.toLowerCase() && m.Stok >= reqItem.Jumlah) {
                            const updatedMed = { ...m, Stok: m.Stok - reqItem.Jumlah };
                            callSheetsApi("saveObat", updatedMed);
                            return updatedMed;
                        }
                        return m;
                    }));
                }
                const updatedReq = { ...reqItem, Status: newStatus };
                setRequests(prev => prev.map(r => r.ID_Order === orderId ? updatedReq : r));
                callSheetsApi("savePermintaan", updatedReq);
                showToast(`Status permohonan diubah menjadi ${newStatus}`);
            };

            const handleDeleteRequest = (orderId) => {
                setRequests(prev => prev.filter(r => r.ID_Order !== orderId));
                callSheetsApi("deletePermintaan", orderId);
                showToast("Data permintaan berhasil dihapus.");
            };

            const handleSaveMahasantriEdit = (mhsData) => {
                setRooms(prev => {
                    const exists = prev.some(m => m.ID === mhsData.ID);
                    if (exists) {
                        return prev.map(m => m.ID === mhsData.ID ? mhsData : m);
                    }
                    return [mhsData, ...prev];
                });
                callSheetsApi("saveMahasantri", mhsData);
                showToast("Data mahasantri tersimpan ke Spreadsheet!");
            };

            const handleDeleteMahasantri = (id) => {
                setRooms(prev => prev.filter(m => m.ID !== id));
                callSheetsApi("deleteMahasantri", id);
                showToast("Mahasantri berhasil dihapus dari Spreadsheet.");
            };

            const handleResetAllToHealthy = () => {
                setRooms(prev => prev.map(o => ({ ...o, Status: "Sehat", Keluhan: "" })));
                callSheetsApi("resetAllHealthy", {});
                showToast("Seluruh status mahasantri disetel menjadi SEHAT!", "success");
            };

            const handleSaveMedicine = (medData) => {
                setMedicines(prev => {
                    const exists = prev.some(m => m.Kode === medData.Kode);
                    if (exists) return prev.map(m => m.Kode === medData.Kode ? medData : m);
                    return [medData, ...prev];
                });
                callSheetsApi("saveObat", medData);
                showToast("Data obat tersimpan ke Spreadsheet!");
            };

            const handleDeleteMedicine = (kode) => {
                setMedicines(prev => prev.filter(m => m.Kode !== kode));
                callSheetsApi("deleteObat", kode);
                showToast("Obat berhasil dihapus.");
            };

            const handleSaveStaff = (staffData) => {
                setStaff(prev => {
                    const exists = prev.some(s => s.ID === staffData.ID);
                    if (exists) return prev.map(s => s.ID === staffData.ID ? staffData : s);
                    return [staffData, ...prev];
                });
                callSheetsApi("savePetugas", staffData);
                showToast("Data petugas tersimpan ke Spreadsheet!");
            };

            const handleDeleteStaff = (id) => {
                setStaff(prev => prev.filter(s => s.ID !== id));
                callSheetsApi("deletePetugas", id);
                showToast("Petugas berhasil dihapus.");
            };

            if (!userRole) {
                return (
                    <AuthContainer 
                        onNimLogin={handleNimLogin}
                        onRegisterMahasantri={handleRegisterMahasantri} 
                        onAdminLogin={handleAdminLogin} 
                        isDarkMode={isDarkMode} 
                        toggleDarkMode={toggleDarkMode}
                        toast={toast}
                    />
                );
            }

            if (userRole === "mahasantri") {
                return (
                    <UserPortalLayout 
                        mahasantri={currentMahasantri} 
                        medicines={medicines} 
                        requests={requests.filter(r => String(r.NIM) === String(currentMahasantri.NIM))} 
                        onRequestMedicine={handleRequestMedicine}
                        onLogout={handleLogout}
                        isDarkMode={isDarkMode}
                        toggleDarkMode={toggleDarkMode}
                        toast={toast}
                    />
                );
            }

            return (
                <div className={`min-h-screen flex flex-col pb-20 md:pb-0 transition-colors duration-200 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    <header className={`sticky top-0 z-30 shadow-md border-b transition-colors duration-200 ${isDarkMode ? 'bg-slate-800/95 border-slate-700/80 backdrop-blur-md' : 'bg-white/95 border-slate-200/80 backdrop-blur-md'}`}>
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2.5 sm:gap-3">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className={`w-10 h-10 rounded-xl flex items-center justify-center transition active:scale-95 ${isDarkMode ? 'text-slate-300 hover:bg-slate-700 bg-slate-800' : 'text-slate-600 hover:bg-slate-100 bg-slate-50'}`}
                                    aria-label="Buka Menu">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white shadow-md shadow-teal-500/20 font-bold text-base">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <div className="leading-tight">
                                        <div className="flex items-center gap-1.5">
                                            <h1 className="font-extrabold text-sm sm:text-base tracking-tight">Ritma Care</h1>
                                            <span className="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-500 border border-emerald-500/30">ADMIN</span>
                                        </div>
                                        <p className="text-[10px] sm:text-[11px] text-teal-600 dark:text-teal-400 font-bold flex items-center gap-1">
                                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                            Terhubung Spreadsheet
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2.5">
                                <button 
                                    onClick={() => syncWithGoogleSheets()}
                                    disabled={isSyncing}
                                    className="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-teal-600 text-white shadow-sm hover:bg-teal-700 active:scale-95 disabled:opacity-50">
                                    <i className={`fa-solid fa-rotate ${isSyncing ? 'fa-spin' : ''}`}></i>
                                    <span className="hidden xs:inline">Sinkron Data</span>
                                </button>

                                <button
                                    onClick={toggleDarkMode}
                                    className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm border transition-all active:scale-95 ${isDarkMode ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-amber-50 text-amber-600 border-amber-200'}`}
                                    aria-label="Toggle Mode Gelap">
                                    <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-300' : 'fa-moon text-slate-700'}`}></i>
                                </button>

                                <button 
                                    onClick={handleLogout}
                                    className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 text-xs font-bold transition flex items-center gap-1.5 active:scale-95">
                                    <i className="fa-solid fa-power-off"></i>
                                    <span className="hidden sm:inline">Keluar</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Drawer */}
                    {isDrawerOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
                            <div className={`relative w-[85%] max-w-xs h-full shadow-2xl flex flex-col justify-between z-10 transition-transform duration-300 ${isDarkMode ? 'bg-slate-800 text-slate-100 border-r border-slate-700' : 'bg-white text-slate-800'}`}>
                                <div className="overflow-y-auto custom-scrollbar">
                                    <div className={`p-4 border-b flex justify-between items-center ${isDarkMode ? 'border-slate-700' : 'border-slate-100'}`}>
                                        <div className="flex items-center gap-2.5">
                                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-500 text-white flex items-center justify-center font-bold shadow-md">
                                                <i className="fa-solid fa-hand-holding-medical text-lg"></i>
                                            </div>
                                            <div>
                                                <h2 className="font-extrabold text-sm bg-gradient-to-r from-teal-600 to-emerald-500 bg-clip-text text-transparent">Ritma Care Admin</h2>
                                                <p className="text-[10px] text-teal-600 dark:text-teal-400 font-bold">Asrama Terpadu</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setIsDrawerOpen(false)} className="text-slate-400 hover:text-slate-200 p-1">
                                            <i className="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    <div className="p-3 space-y-1.5">
                                        {[
                                            { id: "dashboard", icon: "fa-gauge-high", label: "Dashboard Ringkasan" },
                                            { id: "requests", icon: "fa-clipboard-check", label: "Permintaan Obat", badge: requests.filter(r => r.Status === 'Menunggu').length },
                                            { id: "cekmar", icon: "fa-door-open", label: "Data Kamar & MHS" },
                                            { id: "sebat", icon: "fa-pills", label: "Stok Sediaan Obat" },
                                            { id: "reports", icon: "fa-file-signature", label: "Laporan & Surat Resmi" },
                                            { id: "staff", icon: "fa-user-shield", label: "Jadwal Tim ORKES" }
                                        ].map(item => (
                                            <button 
                                                key={item.id}
                                                onClick={() => { setCurrentView(item.id); setIsDrawerOpen(false); }}
                                                className={`w-full flex items-center justify-between px-3.5 py-3 rounded-2xl font-semibold text-sm transition-all active:scale-[0.98] ${
                                                    currentView === item.id 
                                                        ? 'bg-teal-600 text-white shadow-lg shadow-teal-500/20' 
                                                        : isDarkMode ? 'text-slate-300 hover:bg-slate-700/60' : 'text-slate-700 hover:bg-slate-100'
                                                }`}>
                                                <div className="flex items-center gap-3">
                                                    <i className={`fa-solid ${item.icon} text-base`}></i>
                                                    <span className="text-xs sm:text-sm">{item.label}</span>
                                                </div>
                                                {item.badge > 0 && (
                                                    <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-500 text-slate-950 font-black animate-pulse">
                                                        {item.badge}
                                                    </span>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-20 md:bottom-5 left-4 right-4 md:left-auto md:right-5 z-50 animate-bounce">
                            <div className={`px-4 py-3 rounded-2xl shadow-2xl text-white font-semibold flex items-center gap-3 text-xs sm:text-sm ${toast.type === 'error' ? 'bg-red-600' : 'bg-teal-600'}`}>
                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check'} text-base`}></i>
                                <span className="flex-1 leading-snug">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setConfirmModal(null)}></div>
                            <div className={`relative w-full max-w-sm p-6 rounded-3xl shadow-2xl z-10 text-center space-y-4 ${isDarkMode ? 'bg-slate-800 text-slate-100 border border-slate-700' : 'bg-white text-slate-800'}`}>
                                <h3 className="font-bold text-base">{confirmModal.title || "Konfirmasi"}</h3>
                                <p className={`text-xs ${isDarkMode ? 'text-slate-300' : 'text-slate-500'}`}>{confirmModal.message}</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setConfirmModal(null)} className="flex-1 py-2.5 font-bold rounded-xl text-xs bg-slate-200 text-slate-700">Batal</button>
                                    <button onClick={() => { confirmModal.onConfirm(); setConfirmModal(null); }} className="flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs">Ya, Lanjutkan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 md:p-6 space-y-5">
                        {currentView === "dashboard" && <DashboardView rooms={rooms} medicines={medicines} requests={requests} isDarkMode={isDarkMode} />}
                        {currentView === "requests" && <AdminRequestsView requests={requests} onUpdateRequestStatus={handleUpdateRequestStatus} onDeleteRequest={handleDeleteRequest} isDarkMode={isDarkMode} />}
                        {currentView === "cekmar" && <CekmarView rooms={rooms} onSaveMahasantri={handleSaveMahasantriEdit} onDeleteMahasantri={handleDeleteMahasantri} onResetAllToHealthy={handleResetAllToHealthy} setConfirmModal={setConfirmModal} isDarkMode={isDarkMode} />}
                        {currentView === "sebat" && <SebatView medicines={medicines} onSaveMedicine={handleSaveMedicine} onDeleteMedicine={handleDeleteMedicine} isDarkMode={isDarkMode} />}
                        {currentView === "reports" && <ReportsView rooms={rooms} medicines={medicines} requests={requests} isDarkMode={isDarkMode} />}
                        {currentView === "staff" && <StaffView staff={staff} onSaveStaff={handleSaveStaff} onDeleteStaff={handleDeleteStaff} isDarkMode={isDarkMode} />}
                    </main>

                                            <button onClick={() => setEditModal(room)} className="p-1.5 text-teal-500 hover:bg-teal-500/10 rounded-lg text-xs" title="Edit">
                                                <i className="fa-solid fa-pen-to-square"></i>
                                            </button>
                                            <button onClick={() => onDeleteMahasantri(room.ID)} className="p-1.5 text-red-500 hover:bg-red-500/10 rounded-lg text-xs" title="Hapus">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex justify-between items-center text-xs">
                                        <span className="text-slate-400">{room.Jurusan || '-'}</span>
                                        <span className={`font-bold px-2.5 py-0.5 rounded-full text-[10px] ${room.Status === 'Sehat' || room.Status === 'Sehat Bugar' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                            {room.Status}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {editModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditModal(null)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl z-10 space-y-3 ${isDarkMode ? 'bg-slate-800 text-white border border-slate-700' : 'bg-white text-slate-900'}`}>
                                <h3 className="font-bold text-base">Form Edit Data Mahasantri</h3>
                                <form onSubmit={(e) => { e.preventDefault(); onSaveMahasantri(editModal); setEditModal(null); }} className="space-y-3 text-xs">
                                    <input type="text" required value={editModal.Nama} onChange={e => setEditModal({ ...editModal, Nama: e.target.value })} placeholder="Nama Lengkap" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    <input type="text" required value={editModal.NIM} onChange={e => setEditModal({ ...editModal, NIM: e.target.value })} placeholder="NIM" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={editModal.Gedung} onChange={e => setEditModal({ ...editModal, Gedung: e.target.value, Sektor: getSectorByBuilding(e.target.value) })} className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                            <option value="Gedung B">Gedung B (Putra)</option>
                                            <option value="Gedung C">Gedung C (Putri)</option>
                                            <option value="Gedung D">Gedung D (Putra)</option>
                                        </select>
                                        <input type="text" required value={editModal.No_Kamar} onChange={e => setEditModal({ ...editModal, No_Kamar: e.target.value })} placeholder="No Kamar" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    </div>

                                    <select value={editModal.Status} onChange={e => setEditModal({ ...editModal, Status: e.target.value })} className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                        <option value="Sehat Bugar">Sehat Bugar</option>
                                        <option value="Sakit Ringan">Sakit Ringan</option>
                                        <option value="Sakit Sedang">Sakit Sedang</option>
                                        <option value="Isoman">Isoman</option>
                                    </select>

                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setEditModal(null)} className="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 text-white rounded-xl font-bold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SebatView({ medicines, onSaveMedicine, onDeleteMedicine, isDarkMode }) {
            const [editMedModal, setEditMedModal] = useState(null);

            const openAddModal = () => {
                setEditMedModal({
                    Kode: `OBT-${Math.floor(100 + Math.random() * 900)}`,
                    Nama_Obat: "",
                    Sektor: "Putra",
                    Kategori: "Apotek Putra",
                    Stok: 10,
                    Satuan: "Tablet",
                    Deskripsi: ""
                });
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <button onClick={openAddModal} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-sm">
                            <i className="fa-solid fa-plus"></i> Tambah Obat Baru
                        </button>
                    </div>

                    {medicines.length === 0 ? (
                        <div className="text-center py-12 p-6 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-400">
                            <i className="fa-solid fa-pills text-3xl mb-2 text-slate-300 dark:text-slate-600"></i>
                            <p className="text-sm font-bold">Belum ada sediaan obat di Spreadsheet.</p>
                            <p className="text-xs text-slate-400 mt-1">Klik "+ Tambah Obat Baru" untuk menginput stok obat.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 xs:grid-cols-2 lg:grid-cols-4 gap-3">
                            {medicines.map((m, idx) => (
                                <div key={idx} className={`p-4 rounded-3xl border shadow-sm space-y-2 flex flex-col justify-between ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <div>
                                        <div className="flex justify-between items-start">
                                            <span className="text-[10px] font-bold text-teal-500 uppercase">{m.Sektor} • {m.Satuan}</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => setEditMedModal(m)} className="p-1 text-teal-500 hover:bg-teal-500/10 rounded text-xs"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={() => onDeleteMedicine(m.Kode)} className="p-1 text-red-500 hover:bg-red-500/10 rounded text-xs"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                        <h4 className="font-bold text-sm mt-1">{m.Nama_Obat}</h4>
                                        <p className="text-xs text-slate-400 mt-0.5 line-clamp-2">{m.Deskripsi}</p>
                                    </div>
                                    <div className="text-xs font-bold text-emerald-500 pt-2 border-t border-slate-100 dark:border-slate-700/60">
                                        Stok Physical: {m.Stok} {m.Satuan}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {editMedModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditMedModal(null)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl z-10 space-y-3 ${isDarkMode ? 'bg-slate-800 text-white border border-slate-700' : 'bg-white text-slate-900'}`}>
                                <h3 className="font-bold text-base">Kelola Data Obat</h3>
                                <form onSubmit={(e) => { e.preventDefault(); onSaveMedicine(editMedModal); setEditMedModal(null); }} className="space-y-3 text-xs">
                                    <input type="text" required value={editMedModal.Nama_Obat} onChange={e => setEditMedModal({ ...editMedModal, Nama_Obat: e.target.value })} placeholder="Nama Obat" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={editMedModal.Sektor} onChange={e => setEditMedModal({ ...editMedModal, Sektor: e.target.value, Kategori: `Apotek ${e.target.value}` })} className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                            <option value="Putra">Sektor Putra</option>
                                            <option value="Putri">Sektor Putri</option>
                                        </select>
                                        <input type="number" required value={editMedModal.Stok} onChange={e => setEditMedModal({ ...editMedModal, Stok: parseInt(e.target.value, 10) || 0 })} placeholder="Jumlah Stok" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    </div>
                                    <input type="text" value={editMedModal.Deskripsi} onChange={e => setEditMedModal({ ...editMedModal, Deskripsi: e.target.value })} placeholder="Deskripsi Obat..." className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />

                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setEditMedModal(null)} className="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 text-white rounded-xl font-bold">Simpan Obat</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ReportsView({ rooms, medicines, requests, isDarkMode }) {
            const [reportPeriod, setReportPeriod] = useState("Harian");

            const totalSantri = rooms.length;
            const healthySantri = rooms.filter(r => r.Status === "Sehat" || r.Status === "Sehat Bugar").length;
            const sickSantri = totalSantri - healthySantri;

            const handleDownloadPDF = () => {
                const element = document.getElementById('report-document');
                const opt = {
                    margin:       [0.3, 0.3, 0.3, 0.3],
                    filename:     `Laporan_Kesehatan_${reportPeriod}_${new Date().toISOString().split('T')[0]}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap justify-between items-center gap-3">
                        <div className={`p-1 rounded-2xl flex gap-1 ${isDarkMode ? 'bg-slate-800' : 'bg-slate-200'}`}>
                            {["Harian", "Mingguan", "Bulanan", "Semesteran"].map(p => (
                                <button key={p} onClick={() => setReportPeriod(p)} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${reportPeriod === p ? 'bg-teal-600 text-white shadow' : 'text-slate-500'}`}>
                                    {p}
                                </button>
                            ))}
                        </div>
                        <button onClick={handleDownloadPDF} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-sm">
                            <i className="fa-solid fa-file-pdf"></i> Unduh Laporan PDF
                        </button>
                    </div>

                    {/* OFFICIAL PDF REPORT DOCUMENT */}
                    <div id="report-document" className="p-6 sm:p-8 rounded-3xl bg-white text-slate-900 border border-slate-200 font-official space-y-5 shadow-lg">
                        {/* KOP SURAT RESMI */}
                        <div className="text-center border-b-2 border-slate-800 pb-3 space-y-1">
                            <h2 className="text-base font-bold tracking-wider">RITMA OLAHRAGA DAN KESEHATAN</h2>
                            <h3 className="text-xs font-bold uppercase tracking-wide">MA'HAD TAHFIDZ AL-QUR'AN UIN SUNAN GUNUNG DJATI BANDUNG</h3>
                            <div className="inline-block bg-teal-600 text-white text-[10px] font-bold px-2 py-0.5 rounded mt-1 uppercase">
                                {reportPeriod} SUMMARY
                            </div>
                            <p className="text-xs font-bold pt-1">Laporan Kesehatan {reportPeriod} Mahasantri</p>
                            <p className="text-[11px] text-slate-600 italic">Rekapitulasi Pemeriksaan Kamar Pagi & Malam</p>
                            <div className="flex justify-between text-[10px] text-slate-500 pt-1">
                                <span>Periode: {new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                <span>Cetak: {new Date().toLocaleDateString('id-ID')}</span>
                            </div>
                        </div>

                        {/* TOP METRIC CARDS */}
                        <div className="grid grid-cols-4 gap-2 text-center text-xs">
                            <div className="p-2 border rounded-xl bg-slate-50">
                                <span className="text-[10px] font-bold text-slate-500 block">TOTAL SANTRI</span>
                                <span className="text-lg font-bold">{totalSantri}</span>
                                <span className="text-[9px] text-slate-400 block">Gedung B, C, D</span>
                            </div>
                            <div className="p-2 border rounded-xl bg-slate-50">
                                <span className="text-[10px] font-bold text-slate-500 block">KONDISI SEHAT</span>
                                <span className="text-lg font-bold text-emerald-600">{healthySantri}</span>
                                <span className="text-[9px] text-emerald-600 font-bold block">{totalSantri > 0 ? Math.round((healthySantri/totalSantri)*100) : 100}% Sehat</span>
                            </div>
                            <div className="p-2 border rounded-xl bg-slate-50">
                                <span className="text-[10px] font-bold text-slate-500 block">SANTRI SAKIT</span>
                                <span className="text-lg font-bold text-amber-600">{sickSantri}</span>
                                <span className="text-[9px] text-red-500 font-bold block">0 Parah</span>
                            </div>
                            <div className="p-2 border rounded-xl bg-slate-50">
                                <span className="text-[10px] font-bold text-slate-500 block">PEMULIHAN</span>
                                <span className="text-lg font-bold text-teal-600">96.4%</span>
                                <span className="text-[9px] text-slate-400 block">Target 100%</span>
                            </div>
                        </div>

                        {/* KASUS SAKIT PER GEDUNG */}
                        <div className="space-y-1">
                            <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700">Kasus Sakit {reportPeriod} Ini</h4>
                            <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                <div className="p-2 border rounded-xl bg-teal-50/50">
                                    <span className="font-bold block">Gedung B (Putra)</span>
                                    <span className="text-[10px] text-slate-500 block">Kamar LT1 & 2</span>
                                    <span className="text-sm font-bold text-teal-700 block mt-1">{rooms.filter(r => (r.Gedung||'').includes('Gedung B') && r.Status !== 'Sehat').length} Kasus</span>
                                </div>
                                <div className="p-2 border rounded-xl bg-pink-50/50">
                                    <span className="font-bold block">Gedung C (Putri)</span>
                                    <span className="text-[10px] text-slate-500 block">Kamar LT1 & 2</span>
                                    <span className="text-sm font-bold text-pink-700 block mt-1">{rooms.filter(r => (r.Gedung||'').includes('Gedung C') && r.Status !== 'Sehat').length} Kasus</span>
                                </div>
                                <div className="p-2 border rounded-xl bg-indigo-50/50">
                                    <span className="font-bold block">Gedung D (Putra)</span>
                                    <span className="text-[10px] text-slate-500 block">Kamar LT1 & 2</span>
                                    <span className="text-sm font-bold text-indigo-700 block mt-1">{rooms.filter(r => (r.Gedung||'').includes('Gedung D') && r.Status !== 'Sehat').length} Kasus</span>
                                </div>
                            </div>
                        </div>

                        {/* TABLE MAHASANTRI */}
                        <div className="space-y-1">
                            <div className="flex justify-between items-center text-xs font-bold uppercase">
                                <span>DATA MAHASANTRI</span>
                                <span className="text-[10px] text-slate-500">{totalSantri} Terdata</span>
                            </div>
                            <table className="w-full text-left text-xs border border-slate-300">
                                <thead>
                                    <tr className="bg-slate-100 border-b border-slate-300 font-bold">
                                        <th className="p-1.5 border-r border-slate-300 text-center w-8">No</th>
                                        <th className="p-1.5 border-r border-slate-300">NIM</th>
                                        <th className="p-1.5 border-r border-slate-300">Nama</th>
                                        <th className="p-1.5 border-r border-slate-300">Kamar</th>
                                        <th className="p-1.5 border-r border-slate-300">Status</th>
                                        <th className="p-1.5">Keluhan</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {rooms.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="p-3 text-center text-slate-400">Tidak ada data mahasantri.</td>
                                        </tr>
                                    ) : (
                                        rooms.map((m, idx) => (
                                            <tr key={idx}>
                                                <td className="p-1.5 border-r border-slate-300 text-center">{idx + 1}</td>
                                                <td className="p-1.5 border-r border-slate-300 font-mono">{m.NIM}</td>
                                                <td className="p-1.5 border-r border-slate-300 font-bold">{m.Nama}</td>
                                                <td className="p-1.5 border-r border-slate-300">{m.Gedung}-{m.No_Kamar}</td>
                                                <td className="p-1.5 border-r border-slate-300 font-bold">{m.Status}</td>
                                                <td className="p-1.5 text-slate-500">{m.Keluhan || '-'}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {/* SINGLE SIGNATURE SECTION: KETUA TIM ORKES ONLY */}
                        <div className="pt-8 flex justify-end text-center text-xs">
                            <div className="w-64">
                                <p>Pembuat Laporan,</p>
                                <p className="font-bold">Ketua Tim ORKES</p>
                                <div className="h-16"></div>
                                <p className="font-bold underline">M. Nur Fami Lubis</p>
                                <p className="text-[10px] text-slate-400">(Tanda Tangan)</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StaffView({ staff, onSaveStaff, onDeleteStaff, isDarkMode }) {
            const [editStaffModal, setEditStaffModal] = useState(null);

            const openAddModal = () => {
                setEditStaffModal({
                    ID: `STF-${Math.floor(100 + Math.random() * 900)}`,
                    Nama: "",
                    Role: "Apoteker Jaga",
                    No_HP: "+6285776091473",
                    Shift: "Shift Pagi (07:00 - 15:00)",
                    Sektor: "Putra",
                    Status_Jaga: "Bertugas"
                });
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <button onClick={openAddModal} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-sm">
                            <i className="fa-solid fa-plus"></i> Tambah Petugas Jaga
                        </button>
                    </div>

                    {staff.length === 0 ? (
                        <div className="text-center py-12 p-6 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-400">
                            <i className="fa-solid fa-user-shield text-3xl mb-2 text-slate-300 dark:text-slate-600"></i>
                            <p className="text-sm font-bold">Belum ada data petugas di Spreadsheet.</p>
                            <p className="text-xs text-slate-400 mt-1">Klik "+ Tambah Petugas Jaga" untuk menginput jadwal petugas ORKES.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {staff.map((s, idx) => (
                                <div key={idx} className={`p-4 rounded-3xl border shadow-sm space-y-2 flex flex-col justify-between ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                    <div className="space-y-1">
                                        <div className="flex justify-between items-start">
                                            <span className="text-[10px] font-bold text-teal-500 uppercase">{s.Sektor} • {s.Status_Jaga}</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => setEditStaffModal(s)} className="p-1 text-teal-500 hover:bg-teal-500/10 rounded text-xs"><i className="fa-solid fa-pen"></i></button>
                                                <button onClick={() => onDeleteStaff(s.ID)} className="p-1 text-red-500 hover:bg-red-500/10 rounded text-xs"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                        <h4 className="font-bold text-sm">{s.Nama}</h4>
                                        <p className="text-xs text-slate-400">{s.Role} • {s.Shift}</p>
                                    </div>
                                    <div className="pt-2 border-t border-slate-100 dark:border-slate-700/60 text-xs font-mono text-slate-400">
                                        Kontak: {s.No_HP}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {editStaffModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditStaffModal(null)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl shadow-2xl z-10 space-y-3 ${isDarkMode ? 'bg-slate-800 text-white border border-slate-700' : 'bg-white text-slate-900'}`}>
                                <h3 className="font-bold text-base">Kelola Tim Petugas ORKES</h3>
                                <form onSubmit={(e) => { e.preventDefault(); onSaveStaff(editStaffModal); setEditStaffModal(null); }} className="space-y-3 text-xs">
                                    <input type="text" required value={editStaffModal.Nama} onChange={e => setEditStaffModal({ ...editStaffModal, Nama: e.target.value })} placeholder="Nama Petugas" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    <input type="text" required value={editStaffModal.Role} onChange={e => setEditStaffModal({ ...editStaffModal, Role: e.target.value })} placeholder="Jabatan / Role" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />
                                    <input type="text" required value={editStaffModal.No_HP} onChange={e => setEditStaffModal({ ...editStaffModal, No_HP: e.target.value })} placeholder="No WhatsApp" className={`w-full p-2.5 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />

                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setEditStaffModal(null)} className="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 text-white rounded-xl font-bold">Simpan Petugas</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
